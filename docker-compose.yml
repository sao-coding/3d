name: 3d

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ports:
      - "3333:3001"
    env_file:
      - .env
    volumes:
      - type: bind
        source: ./.data
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
